<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left bracket -->
  <path d="M10 8 L6 16 L10 24" 
        stroke="#00F0FF" 
        stroke-width="2" 
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Slash -->
  <path d="M16 8 L16 24" 
        stroke="#8A2BE2" 
        stroke-width="2.5" 
        filter="url(#glow)"/>
  
  <!-- Right bracket -->
  <path d="M22 8 L26 16 L22 24" 
        stroke="#8A2BE2" 
        stroke-width="2" 
        fill="none"
        filter="url(#glow)"/>
</svg>